name: Vision Cut AI CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest black ruff mypy

      - name: Ruff
        run: ruff check .

      - name: Format Check
        run: ruff format . --check

      - name: Type Check
        run: mypy backend

      - name: Tests
        run: pytest